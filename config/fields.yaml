# Form fields. "name" is the placeholder used in templates: {name}.
# Types: text, date, select (options), amount, amount_in_words (source), checkbox ({#skresl:name}...{/skresl}).
fields:
  - name: numer_umowy
    label: Numer umowy
    type: text
  - name: data_zawarcia_umowy
    label: Data zawarcia umowy
    type: date
  - name: imie
    label: Imię
    type: text
  - name: nazwisko
    label: Nazwisko
    type: text
  - name: data_urodzenia
    label: Data urodzenia
    type: date
  - name: miejsce_urodzenia
    label: Miejsce urodzenia
    type: text
  - name: pesel
    label: PESEL
    type: text
  - name: adres_zameldowania
    label: Adres zameldowania
    type: text
  - name: adres_zamieszkania
    label: Adres zamieszkania
    type: text
  - name: kwota
    label: Kwota (zł)
    type: amount
  - name: jednostka
    label: Jednostka
    type: select
    options: [miesięcznie, godzinowo]
  - name: kwota_slownie
    label: Kwota słownie
    type: amount_in_words
    source: kwota
  - name: urzad_skarbowy
    label: Urząd skarbowy
    type: text
  - name: dodatkowy_checkbox
    label: Dodatkowy akapit dotyczy
    type: checkbox
