# Form fields. "name" is the placeholder used in templates: {name}.
# Types: text, date, select (options), amount, amount_in_words (source), checkbox ({#skresl:name}...{/skresl}).
fields:
  - name: numer_umowy
    label: Numer umowy
    type: text
  - name: data_zawarcia_umowy
    label: Data zawarcia umowy
    type: date
  - name: data_rozpoczecia_umowy
    label: Data rozpoczęcia umowy
    type: date
  - name: imie
    label: Imię
    type: text
  - name: nazwisko
    label: Nazwisko
    type: text
  - name: data_urodzenia
    label: Data urodzenia
    type: date
  - name: miejsce_urodzenia
    label: Miejsce urodzenia
    type: text
  - name: pesel
    label: PESEL
    type: text
  - name: adres_zameldowania
    label: Adres zameldowania
    type: text
  - name: adres_zamieszkania
    label: Adres zamieszkania
    type: text
  - name: kwota
    label: Kwota (zł)
    type: amount
  - name: jednostka
    label: Jednostka
    type: select
    options: [ pełen miesięczny zakres, godzinę ]
    default: "pełen miesięczny zakres"
  - name: kwota_slownie
    label: Kwota słownie
    type: amount_in_words
    source: kwota
  - name: urzad_skarbowy
    label: Urząd skarbowy
    type: text
  - name: bezrobotny_checkbox
    label: Bezrobotny ...
    type: checkbox
    default: false
  - name: urzad_pracy
    label: ... zarejestrowany w rejonowym urzędzie pracy
    type: text
    enabled_if: "bezrobotny_checkbox"
    disabled_value: ""
  - name: student_checkbox
    label: Uczeń / Student ...
    type: checkbox
    default: false
  - name: 26lat_checkbox
    label: ... ma 26 lat lub mniej
    type: checkbox
    enabled_if: "student_checkbox"
    default: false
  - name: legitymacja_studencka_checkbox
    label: ... ma ważną legitymację
    type: checkbox
    default: false
    enabled_if: "student_checkbox"
    disabled_value: false
  - name: zatrudniony_checkbox
    label: Zatrudniony gdzie indziej ...
    type: checkbox
    default: false
  - name: zatrudniony_uop_checkbox
    label: ... na UoP ...
    type: checkbox
    default: false
    enabled_if: "zatrudniony_checkbox"
    disabled_value: false
  - name: zatrudniony_nazwa_firmy_uop
    label: ... w firmie
    type: text
    enabled_if: "zatrudniony_uop_checkbox"
    disabled_value: ""
  - name: zatrudniony_zlecenie_checkbox
    label: ... na zlecenie ...
    type: checkbox
    default: false
    enabled_if: "zatrudniony_checkbox"
    disabled_value: false
  - name: zatrudniony_nazwa_firmy_zlecenie
    label: ... w firmie
    type: text
    enabled_if: "zatrudniony_zlecenie_checkbox"
    disabled_value: ""
  - name: podstawa_wymiaru_skladek_1_checkbox
    label: Podstawa wymiaru składek na ubezpieczenie społeczne emerytalne i rentowe jest równa lub wyższa od płacy minimalnej ...
    type: checkbox
    default: false
    disabled_value: false
  - name: podstawa_wymiaru_skladek_2_checkbox
    label: ... i niższa kwocie wynagrodzenia
    type: checkbox
    default: false
    enabled_if: "podstawa_wymiaru_skladek_1_checkbox"
    disabled_value: false
  - name: podstawa_wymiaru_skladek_3_checkbox
    label: ... i równa lub wyższa kwocie wynagrodzenia
    type: checkbox
    default: false
    enabled_if: "podstawa_wymiaru_skladek_1_checkbox"
    disabled_value: false
  - name: dzialalnosc_checkbox
    label: Prowadzi działalność ...
    type: checkbox
    default: false
  - name: dzialalnosc_rolnicza_checkbox
    label: ... rolniczą
    type: checkbox
    enabled_if: "dzialalnosc_checkbox"
    disabled_value: false
  - name: dzialalnosc_pozarolnicza_checkbox
    label: ... pozarolniczą
    type: checkbox
    enabled_if: "dzialalnosc_checkbox"
    disabled_value: false
  - name: nowy_przedsiebiorca_checkbox
    label: Opłaca składki na zasadach preferencyjnych jako Nowy Przedsiębiorca
    type: checkbox
    default: false
  - name: przedmiot_umowy_checkbox
    label: Przedmiot umowy wchodzi w zakres prowadzonej działalności gospodarczej
    type: checkbox
    default: false
  - name: ubezpieczenie_spoleczne_checkbox
    label: Ubezpieczenie społeczne
    type: checkbox
    default: false
  - name: urlop_checkbox
    label: Urlop ...
    type: checkbox
    default: false
  - name: urlop_macierzynski_checkbox
    label: ... macierzyński
    type: checkbox
    default: false
    enabled_if: "urlop_checkbox"
    disabled_value: false
  - name: urlop_wychowawczy_checkbox
    label: ... wychowawczy
    type: checkbox
    default: false
    enabled_if: "urlop_checkbox"
    disabled_value: false
  - name: urlop_bezplatny_checkbox
    label: ... bezpłatny
    type: checkbox
    default: false
    enabled_if: "urlop_checkbox"
    disabled_value: false
  - name: emeryt_checkbox
    label: Emeryt ...
    type: checkbox
    default: false
  - name: legitymacja_emerycka
    label: ... numer legitymacji ...
    type: text
    enabled_if: "emeryt_checkbox"
    disabled_value: ""
  - name: legitymacja_emerycka_z_dnia
    label: ... z dnia
    type: date
    enabled_if: "emeryt_checkbox"
  - name: rencista_checkbox
    label: Rencista ...
    type: checkbox
    default: false
  - name: renta_rodzinna_checkbox
    label: ... i otrzymuje rentę rodzinną ...
    type: checkbox
    default: false
    enabled_if: "rencista_checkbox"
  - name: legitymacja_rencisty
    label: ... numer legitymacji
    type: text
    enabled_if: "rencista_checkbox"
    disabled_value: ""
  - name: legitymacja_rencisty_z_dnia
    label: ... z dnia
    type: date
    enabled_if: "rencista_checkbox"
  - name: niepelnosprawnosc_checkbox
    label: Niepełnosprawność ...
    type: checkbox
    default: false
  - name: niepelnosprawnosc_lekka_checkbox
    label: ... lekka
    type: checkbox
    default: false
    enabled_if: "niepelnosprawnosc_checkbox"
    disabled_value: false
  - name: niepelnosprawnosc_umiarkowana_checkbox
    label: ... umiarkowana
    type: checkbox
    default: false
    enabled_if: "niepelnosprawnosc_checkbox"
    disabled_value: false
  - name: niepelnosprawnosc_znaczna_checkbox
    label: ... znaczna
    type: checkbox
    default: false
    enabled_if: "niepelnosprawnosc_checkbox"
    disabled_value: false
  - name: limit_kosztow_autorskich_checkbox
    label: Limit kosztów autorskich przekracza ograniczenia roczne
    type: checkbox
    default: false
  - name: zastosowano_koszty_autorskie_kwota
    label: Dotychczas zastosowano koszty autorskie o wartości (zł)
    type: amount
    default: 0
  - name: obowiazek_podatkowy_checkbox
    label: Podlega nieograniczonemu obowiązkowi podatkowemu w Polsce
    type: checkbox
    default: true
